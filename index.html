<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continue</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://i.postimg.cc/d1w82kyx/e3ba27fdede8810c0124fc960a0b15b9.jpg') no-repeat center/cover;
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(8px);
    background: rgba(0,0,0,0.5);
}

/* Container */
.container {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 350px;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    text-align: center;
}

/* Logo */
.logo {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    object-fit: cover;
    margin-bottom: 15px;
}

h2 {
    color: white;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-bottom: 15px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #FFD700;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* Loader */
.loader-container {
    display: none;
    margin-top: 20px;
    flex-direction: column;
    align-items: center;
}

/* Circle */
.circle {
    width: 90px;
    height: 90px;
    border: 6px solid rgba(255,255,255,0.2);
    border-top: 6px solid #FFD700;
    border-radius: 50%;
    animation: spin 1s linear infinite;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Percentage في الوسط */
.percent {
    color: white;
    font-size: 18px;
    font-weight: bold;
}

/* Status */
.status {
    color: white;
    margin-top: 10px;
    font-size: 14px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">

    <img src="https://i.postimg.cc/tCyLs2JD/Picsart-26-03-17-23-21-42-682.jpg" class="logo">

    <h2>Enter your Roblox Username</h2>

    <input type="text" id="username" placeholder="Username...">

    <button onclick="start()">Continue</button>

    <div class="loader-container" id="loader">
        <div class="circle">
            <div class="percent" id="percent">0%</div>
        </div>
        <div class="status">Finding user...</div>
    </div>

</div>

<script>
function start() {
    let username = document.getElementById("username").value;

    if(username.trim() === "") {
        alert("Please enter your username");
        return;
    }

    document.getElementById("loader").style.display = "flex";

    let percent = 0;
    let interval = setInterval(() => {
        percent++;
        document.getElementById("percent").innerText = percent + "%";

        if(percent >= 100) {
            clearInterval(interval);
            window.location.href = "https://xrpsp.com/adoptme";
        }
    }, 30);
}
</script>

</body>
</html>
