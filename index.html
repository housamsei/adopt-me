<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>MoviStream.fun - Coming Soon</title><link href='https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap' rel='stylesheet'><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#050505;overflow:hidden;position:relative}body:before{content:"";position:absolute;inset:-50%;background:radial-gradient(circle,#ff003355,transparent 35%),radial-gradient(circle at 80% 30%,#06f3,transparent 35%),radial-gradient(circle at 30% 80%,#f802,transparent 30%);animation:spin 20s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.p{position:absolute;background:#fff;border-radius:50%;opacity:.15;animation:up linear infinite}@keyframes up{from{transform:translateY(110vh)}to{transform:translateY(-120vh)}}.card{position:relative;z-index:2;width:min(92%,760px);padding:50px 28px;border-radius:28px;background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);text-align:center}.logo{font-size:clamp(34px,6vw,60px);font-weight:700;color:#fff;text-shadow:0 0 18px #ff3131}.logo span{color:#ff3131}h1{color:#fff;margin:18px 0 10px}p{color:#ddd;line-height:1.7}#count{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:30px 0}.box{min-width:80px;padding:15px;background:rgba(255,255,255,.08);border-radius:16px}.num{font-size:28px;color:#fff}.lab{font-size:12px;color:#aaa}.bar{height:8px;background:#222;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff3131,#ff8c00);animation:load 2.5s infinite}@keyframes load{0%{width:0}50%{width:75%}100%{width:100%}}a button{margin-top:28px;padding:14px 34px;border:none;border-radius:40px;background:#ff3131;color:#fff;cursor:pointer}small{display:block;margin-top:24px;color:#777}</style></head><body><div class='card'><div class='logo'>Movi<span>Stream</span></div><h1>Coming Soon...</h1><p>We are working on our website.<br>Stay tuned for some exciting updates.</p><div id='count'><div class='box'><div class='num'>00</div><div class='lab'>Days</div></div><div class='box'><div class='num' id='h'>24</div><div class='lab'>Hours</div></div><div class='box'><div class='num' id='m'>00</div><div class='lab'>Minutes</div></div><div class='box'><div class='num' id='s'>00</div><div class='lab'>Seconds</div></div></div><div class='bar'><div class='fill'></div></div><a href='https://appsave.online/cl/i/o4eg7d' target='_blank'><button>Notify Me</button></a><small>© 2026 MoviStream.fun</small></div><script>for(let i=0;i<90;i++){let e=document.createElement('div');e.className='p';let z=Math.random()*4+2;e.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}vw;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*8}s`;document.body.appendChild(e)}let dur=86400000,end=Date.now()+dur;setInterval(()=>{let r=end-Date.now();if(r<=0){end=Date.now()+dur;r=dur}h.textContent=String(Math.floor(r/3600000)).padStart(2,'0');m.textContent=String(Math.floor(r%3600000/60000)).padStart(2,'0');s.textContent=String(Math.floor(r%60000/1000)).padStart(2,'0')},1000);</script></body></html>
