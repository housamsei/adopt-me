<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoviStream.fun - Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:#050505;
position:relative;

}

/* Animated Background */

body::before{

content:"";
position:absolute;
width:250%;
height:250%;
background:
radial-gradient(circle,#ff005520 0%,transparent 40%),
radial-gradient(circle,#0088ff22 0%,transparent 40%),
radial-gradient(circle,#00ff9920 0%,transparent 40%);
animation:bgMove 18s linear infinite;

}

@keyframes bgMove{

0%{transform:translate(-20%,-20%) rotate(0deg);}
50%{transform:translate(-10%,-15%) rotate(180deg);}
100%{transform:translate(-20%,-20%) rotate(360deg);}

}

/* Particles */

.particle{

position:absolute;
border-radius:50%;
background:white;
opacity:.18;
animation:float linear infinite;

}

@keyframes float{

0%{
transform:translateY(120vh);
}

100%{
transform:translateY(-120vh);
}

}

/* Card */

.container{

position:relative;
z-index:2;
width:90%;
max-width:700px;
padding:60px 40px;
text-align:center;
background:rgba(255,255,255,.05);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.12);
border-radius:25px;
box-shadow:0 0 40px rgba(0,0,0,.6);

animation:fade 1.5s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
transform:none;
}

}

.logo{

font-size:55px;
font-weight:700;
color:#fff;
letter-spacing:2px;
animation:pulse 2s infinite;

}

.logo span{

color:#ff3131;

}

@keyframes pulse{

0%,100%{
text-shadow:0 0 15px #ff3131;
}

50%{
text-shadow:0 0 35px #ff3131;
}

}

h2{

margin-top:20px;
font-size:36px;
color:#fff;

}

p{

margin-top:15px;
font-size:18px;
line-height:1.7;
color:#d4d4d4;

}

.bar{

margin:40px auto 20px;
width:100%;
height:8px;
background:#2b2b2b;
border-radius:50px;
overflow:hidden;

}

.progress{

height:100%;
width:30%;
background:linear-gradient(90deg,#ff3131,#ff7b00);
border-radius:50px;
animation:loading 2s infinite;

}

@keyframes loading{

0%{
width:0%;
}

50%{
width:80%;
}

100%{
width:100%;
}

}

.status{

font-size:15px;
color:#aaa;
letter-spacing:2px;
text-transform:uppercase;

}

.footer{

margin-top:40px;
font-size:14px;
color:#777;

}

</style>
</head>
<body>

<script>

for(let i=0;i<70;i++){

let p=document.createElement("div");

p.className="particle";

let s=Math.random()*5+2;

p.style.width=s+"px";

p.style.height=s+"px";

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=(Math.random()*12+8)+"s";

p.style.animationDelay=Math.random()*10+"s";

document.body.appendChild(p);

}

</script>

<div class="container">

<div class="logo">
Movi<span>Stream</span>
</div>

<h2>Coming Soon...</h2>

<p>
We are working hard to bring you an amazing movie streaming experience.
Stay tuned for exciting updates and get ready for something incredible.
</p>

<div class="bar">
<div class="progress"></div>
</div>

<div class="status">
Launching Soon...
</div>

<div class="footer">
© 2026 MoviStream.fun • All Rights Reserved
</div>

</div>

</body>
</html>
