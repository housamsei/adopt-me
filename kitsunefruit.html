<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Blox Fruit Item | Kitsune Fruit Claim</title>
  <!-- Google Fonts for modern typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: url('https://i.postimg.cc/3R80hvYb/61e4a909e0144761654ee02d2d482fc2.jpg') no-repeat center center fixed;
      background-size: cover;
      /* 50% blur effect on background (pseudo-element for backdrop) */
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Blurred background overlay: exactly 50% blur effect relative to the image */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: inherit;
      background-size: cover;
      background-position: center center;
      filter: blur(12px); /* strong blur for 50% 'foggy' effect */
      opacity: 0.5;  /* 50% mix of original + blurred = 50% foggy look */
      z-index: -2;
    }

    /* Additional dark subtle overlay to enhance readability */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: -1;
    }

    /* Main container - glassmorphism card */
    .container {
      max-width: 550px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    /* Logo top-left - small, square, rounded corners */
    .logo {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 100;
      width: 56px;
      height: 56px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      backdrop-filter: blur(4px);
      padding: 6px;
      transition: transform 0.2s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }
    .logo:hover {
      transform: scale(1.02);
    }

    /* Main Glass Card (transparent frame) */
    .fruit-card {
      background: rgba(20, 20, 35, 0.55);
      backdrop-filter: blur(14px);
      border-radius: 48px;
      padding: 30px 28px 42px;
      box-shadow: 0 30px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Fruit image wrapper: square rounded frame */
    .fruit-image-wrapper {
      width: 240px;
      height: 240px;
      margin: 0 auto 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 36px;
      padding: 12px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 215, 0, 0.5);
      box-shadow: 0 20px 30px -10px black;
    }
    .fruit-image {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      object-fit: cover;
      display: block;
      transition: transform 0.25s;
    }
    .fruit-image:hover {
      transform: scale(1.02);
    }

    /* Dragon Fruit Title */
    .fruit-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #FFD966, #FF8C42, #F04F23);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 5px rgba(0,0,0,0.2);
      margin-bottom: 28px;
      word-break: keep-all;
    }

    /* Username input field */
    .input-group {
      margin-bottom: 32px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: 10px;
      font-size: 1rem;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .username-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 60px;
      padding: 16px 24px;
      font-size: 1.05rem;
      font-weight: 500;
      color: white;
      font-family: 'Inter', monospace;
      transition: all 0.2s;
      outline: none;
      backdrop-filter: blur(5px);
    }
    .username-input:focus {
      border-color: #FFA559;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 12px rgba(255, 165, 89, 0.4);
    }
    .username-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
      font-weight: 400;
    }

    /* Claim button professional */
    .claim-btn {
      background: linear-gradient(105deg, #F97316, #EA580C);
      border: none;
      width: 100%;
      padding: 16px 20px;
      border-radius: 60px;
      font-size: 1.5rem;
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
      letter-spacing: 1px;
      border: 1px solid rgba(255, 140, 0, 0.6);
    }
    .claim-btn i {
      font-size: 1.6rem;
      transition: transform 0.2s;
    }
    .claim-btn:hover {
      background: linear-gradient(105deg, #EA580C, #C2410C);
      transform: translateY(-3px);
      box-shadow: 0 18px 28px -6px rgba(0, 0, 0, 0.5);
    }
    .claim-btn:active {
      transform: translateY(1px);
      transition: 0.05s;
    }

    /* additional glow and footer micro */
    .info-text {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #ddd;
      text-shadow: 0 1px 2px black;
      opacity: 0.8;
    }
    .info-text i {
      margin-right: 5px;
    }

    /* responsive adjustments */
    @media (max-width: 550px) {
      .fruit-card {
        padding: 22px 18px 32px;
      }
      .fruit-title {
        font-size: 2.2rem;
      }
      .fruit-image-wrapper {
        width: 180px;
        height: 180px;
      }
      .logo {
        width: 48px;
        height: 48px;
        top: 16px;
        left: 16px;
      }
      .claim-btn {
        font-size: 1.3rem;
        padding: 14px;
      }
    }
    @media (max-width: 420px) {
      .fruit-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Logo top-left (small, square, rounded) -->
  <div class="logo">
    <img src="https://i.postimg.cc/BZdDLtgJ/Roblox-Logo-2025.png" alt="Roblox Logo 2025">
  </div>

  <div class="container">
    <div class="fruit-card">
      <!-- Transparent frame image container (square, rounded edges) -->
      <div class="fruit-image-wrapper">
        <img class="fruit-image" src="https://i.postimg.cc/g0GpJy5t/e82e7c471a00507a4a07d3ca5773d2e4.jpg" alt="Kitsune Fruit Blox Fruit">
      </div>
      
      <!-- Professional name under image: DRAGON FRUIT -->
      <div class="fruit-title">KITSUNE FRUIT</div>
      
      <!-- Username field -->
      <div class="input-group">
        <label><i class="fas fa-user-astronaut"></i> ROBLOX USERNAME</label>
        <input type="text" class="username-input" id="robloxUsername" placeholder="Enter your username..." autocomplete="off">
      </div>
      
      <!-- Claim button: redirect after click -->
      <button class="claim-btn" id="claimButton">
        <i class="fas fa-gem"></i> CLAIM NOW <i class="fas fa-arrow-right"></i>
      </button>
      
      <div class="info-text">
        <i class="fas fa-shield-alt"></i> Limited Kitsune Fruit • One per user
      </div>
    </div>
  </div>

  <script>
    (function() {
      const claimBtn = document.getElementById('claimButton');
      const usernameInput = document.getElementById('robloxUsername');
      
      // Redirection target URL
      const TARGET_URL = 'https://installchecker.com/cl/v/7j7n9v';
      
      // Helper: validate username (non-empty, roblox-style safe check)
      function isValidUsername(username) {
        if (!username || username.trim() === '') return false;
        // Roblox usernames: 3-20 characters, alphanumeric + underscores, but we don't overrestrict.
        // Just ensure not empty and not only spaces.
        const trimmed = username.trim();
        if (trimmed.length < 1) return false;
        // Optional: avoid weird characters but keep friendly
        // We'll allow basic letters/numbers/_ but not block heavily, just a friendly check
        // but for user experience, any non-empty trimmed is okay, but we also want to block only whitespace.
        return true;
      }
      
      // Show feedback if username empty (optional gentle alert)
      function showMessage(msg, isError = true) {
        // create or reuse a toast-like alert but simple and not invasive.
        let toast = document.querySelector('.custom-toast-msg');
        if (!toast) {
          toast = document.createElement('div');
          toast.className = 'custom-toast-msg';
          toast.style.position = 'fixed';
          toast.style.bottom = '30px';
          toast.style.left = '50%';
          toast.style.transform = 'translateX(-50%)';
          toast.style.backgroundColor = 'rgba(0,0,0,0.85)';
          toast.style.backdropFilter = 'blur(8px)';
          toast.style.color = '#ffc107';
          toast.style.padding = '12px 24px';
          toast.style.borderRadius = '60px';
          toast.style.fontWeight = '600';
          toast.style.fontSize = '0.9rem';
          toast.style.zIndex = '999';
          toast.style.fontFamily = "'Inter', sans-serif";
          toast.style.border = '1px solid rgba(255,165,0,0.5)';
          toast.style.boxShadow = '0 6px 16px rgba(0,0,0,0.3)';
          toast.style.pointerEvents = 'none';
          toast.style.whiteSpace = 'nowrap';
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.color = isError ? '#FFB347' : '#A3E4A3';
        toast.style.borderLeft = isError ? '4px solid #F97316' : '4px solid #2ecc71';
        toast.style.display = 'block';
        setTimeout(() => {
          if (toast) toast.style.display = 'none';
        }, 2500);
      }
      
      // Redirect logic with validation
      function handleClaim() {
        let rawUsername = usernameInput.value;
        let username = rawUsername ? rawUsername.trim() : '';
        
        if (!isValidUsername(username)) {
          showMessage('❌ Please enter a valid Roblox username!', true);
          // add shake effect on input
          usernameInput.style.transform = 'shake 0.3s ease';
          usernameInput.style.borderColor = '#F97316';
          setTimeout(() => {
            usernameInput.style.borderColor = '';
            usernameInput.style.transform = '';
          }, 400);
          return;
        }
        
        // Optional: store username in localStorage for tracking? not needed, but feel free.
        // Provide success feedback before redirect
        showMessage(`✅ Redirecting, ${username}... Claim your Kitsune Fruit!`, false);
        
        // Small delay to let the toast appear and user see feedback, but redirect fast enough.
        setTimeout(() => {
          window.location.href = TARGET_URL;
        }, 400);
      }
      
      // attach click event
      claimBtn.addEventListener('click', handleClaim);
      
      // optional: press Enter in input field triggers claim
      usernameInput.addEventListener('keypress', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          handleClaim();
        }
      });
      
      // small animation for button hover effect smoothness (already in CSS)
      // Preload images? not needed.
      console.log('Blox Fruit Landing Ready — Kitsune Fruit Edition');
    })();
  </script>
  <!-- Fix for any missing shake keyframes if browser needs it (just a tiny extra) -->
  <style>
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
      100% { transform: translateX(0); }
    }
    .username-input:active {
      transform: none;
    }
  </style>
</body>
</html>
